[pytest]
# The benchmark's *validation* suites are the test_phase*.py files. The task
# `hidden/` suites, `_smoke/` calibration fixtures, and captured `_live-smoke/`
# run outputs are ground truth invoked explicitly by the scorers — not part of
# the default suite. They share basenames (every task has a `test_hidden.py`),
# so auto-collecting them collides. Excluding the dirs from recursion keeps a
# bare `pytest` run clean; the scorers still invoke those files by explicit path.
norecursedirs = hidden _smoke _live-smoke results .venv __pycache__ build-doctrine-workspace
testpaths = tasks/test_phase1.py test_phase2.py test_phase3.py test_phase4.py test_phase5.py
