# Review Agent Configuration
# Settings for the unified review workflow

# Agent settings
agent:
  # Extraction: haiku agents, batched by files
  extraction:
    model: haiku
    max_files_per_agent: 5

  # Checking: one agent per checklist
  # Model configurable per profile (default: sonnet)
  checking:
    default_model: sonnet  # Checklist execution needs reasoning depth

  # Orchestrate: single agent, batches findings and creates tasks
  orchestrate:
    model: haiku  # Just batching, no deep reasoning

  # Investigation: one agent per batch of findings
  # Model configurable per profile (default: sonnet)
  investigation:
    default_model: sonnet  # Verification needs reasoning depth
    max_findings_per_agent: 5

# Profile locations
profiles:
  # Built-in profiles (shipped with plugin)
  builtin: agents/profiles/

  # User profiles (created via review-profile setup)
  user: .code-foundations/profiles/

# Output paths
output:
  # Base directory for review output (cross-platform)
  # Uses first available: $TMPDIR (macOS), $TEMP (Windows), $TMP, /tmp
  # Per-run: {base}/{repo}-{branch}-{HHMM}/
  #   extraction/    - Batch extraction results
  #   checking/      - Per-checklist findings
  #   orchestrate.json - Batching summary
  #   investigation/ - Per-batch verdicts
  #   dashboard.html - Generated on demand
# tested building sub-phases
