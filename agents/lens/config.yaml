# Lens Review Configuration
# Maps review types to skills. Each skill = one agent.

# Triage patterns for routing chunks to categories
triage:
  defensive:
    patterns:
      - "error"
      - "catch"
      - "try"
      - "exception"
      - "auth"
      - "password"
      - "token"
      - "secret"
      - "validate"
      - "sanitize"
    file_patterns:
      - "**/auth/**"
      - "**/security/**"

  quality:
    # Catch-all for code structure
    default: true

  correctness:
    patterns:
      - "test"
      - "spec"
      - "assert"
      - "expect"
      - "mock"
    file_patterns:
      - "**/*_test.*"
      - "**/*.test.*"
      - "**/*.spec.*"
      - "**/test/**"
      - "**/tests/**"

  performance:
    patterns:
      - "loop"
      - "for"
      - "while"
      - "async"
      - "await"
      - "cache"
      - "buffer"
      - "batch"
    file_patterns:
      - "**/perf/**"
      - "**/benchmark/**"

  documentation:
    file_patterns:
      - "**/*.md"
      - "**/docs/**"
      - "**/README*"

# Review type definitions
reviews:
  # Level 2: Medium review (3 categories)
  review-changes:
    categories:
      defensive:
        skills:
          - cc-defensive-programming
          - aposd-simplifying-complexity
        verdict_scale: [VULNERABLE, FRAGILE, ADEQUATE, HARDENED]

      quality:
        skills:
          - aposd-reviewing-module-design
          - cc-code-layout-and-style
          - cc-control-flow-quality
        verdict_scale: [POOR, ADEQUATE, GOOD, EXCELLENT]

      correctness:
        skills:
          - aposd-verifying-correctness
          - cc-quality-practices
        verdict_scale: [BUGGY, UNCERTAIN, LIKELY_CORRECT, VERIFIED]

  # Level 3: Full PR review (5 categories)
  review-pr:
    categories:
      defensive:
        skills:
          - cc-defensive-programming
          - aposd-simplifying-complexity
        verdict_scale: [VULNERABLE, FRAGILE, ADEQUATE, HARDENED]

      quality:
        skills:
          - aposd-reviewing-module-design
          - cc-code-layout-and-style
          - cc-control-flow-quality
        verdict_scale: [POOR, ADEQUATE, GOOD, EXCELLENT]

      correctness:
        skills:
          - aposd-verifying-correctness
          - cc-quality-practices
        verdict_scale: [BUGGY, UNCERTAIN, LIKELY_CORRECT, VERIFIED]

      performance:
        skills:
          - cc-performance-tuning
          - aposd-optimizing-critical-paths
        verdict_scale: [SLOW, ACCEPTABLE, OPTIMIZED, EXCELLENT]

      documentation:
        skills:
          - cc-documentation-quality
        verdict_scale: [MISSING, INCOMPLETE, ADEQUATE, EXCELLENT]

# Agent configuration
agent:
  model: sonnet
  max_checklist_items: 120  # Per agent soft limit

# Output paths
output:
  base_dir: /tmp/lens-review
  # Per-run: /tmp/lens-review-{RUN_ID}/
  #   {category}/
  #     {skill}.md        - Individual skill results
  #     summary.md        - Category summary
  #   REPORT.md           - Final merged report
