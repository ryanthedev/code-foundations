# PR Profile - Full review
# 10 skills, 614 checks across all categories

name: pr
description: "Full PR review - 10 skills, 614 checks"

# Parallelism (default: 3)
max_parallelism: 3  # Max concurrent agents per phase

# Model configuration (optional - defaults shown)
models:
  checking: haiku       # Checklist execution - systematic, not deep reasoning
  investigation: haiku  # Verification - confirm/reject findings
  report: haiku         # JSON compilation - no deep reasoning needed

checklists:
  # Defensive (75 checks)
  - path: skills/cc-defensive-programming/checklists.md
    skills: [cc-defensive-programming]
  - path: skills/aposd-simplifying-complexity/checklists.md
    skills: [aposd-simplifying-complexity]

  # Quality (245 checks)
  - path: skills/aposd-reviewing-module-design/checklists.md
    skills: [aposd-reviewing-module-design]
  - path: skills/cc-code-layout-and-style/checklists.md
    skills: [cc-code-layout-and-style]
  - path: skills/cc-control-flow-quality/checklists.md
    skills: [cc-control-flow-quality]

  # Correctness (155 checks)
  - path: skills/aposd-verifying-correctness/checklists.md
    skills: [aposd-verifying-correctness]
  - path: skills/cc-quality-practices/checklists.md
    skills: [cc-quality-practices]

  # Performance (90 checks)
  - path: skills/cc-performance-tuning/checklists.md
    skills: [cc-performance-tuning]
  - path: skills/aposd-optimizing-critical-paths/checklists.md
    skills: [aposd-optimizing-critical-paths]

  # Documentation (49 checks)
  - path: skills/cc-documentation-quality/checklists.md
