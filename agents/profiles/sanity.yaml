# Sanity Profile - Quick pre-commit check
# 14 consensus-distilled checks applied per unit

name: sanity
description: "Quick pre-commit sanity check - 14 core checks per unit"

# Parallelism (default: 5)
max_parallelism: 5  # Max concurrent agents per phase

# Model configuration (optional - defaults shown)
models:
  checking: sonnet       # Needs reasoning depth for accurate checks
  investigation: sonnet  # Needs reasoning depth for verification

checklists:
  - path: agents/core-checklist.md
    skills: []  # Self-contained checklist, distilled via 7-agent consensus
