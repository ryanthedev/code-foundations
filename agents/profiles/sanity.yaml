# Sanity Profile - Quick pre-commit check
# 99 curated critical checks in a single checklist

name: sanity
description: "Quick pre-commit sanity check - 99 critical checks"

# Parallelism (default: 3)
max_parallelism: 3  # Max concurrent agents per phase

# Model configuration (optional - defaults shown)
models:
  checking: sonnet       # Needs reasoning depth for accurate checks
  investigation: sonnet  # Needs reasoning depth for verification
  report: haiku          # Simple report for sanity check

# Custom dashboard generation
dashboard:
  enabled: false        # Skip custom dashboard for quick sanity check
  model: sonnet         # Needs creativity for unique design

checklists:
  - path: agents/quick-checklist.md
    skills: []  # Self-contained checklist, no skill persona needed
