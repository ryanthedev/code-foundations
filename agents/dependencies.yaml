# Dependency Resolution Configuration
# Enables investigation agents to resolve symbols in external/compiled code
#
# How it works:
# 1. During extraction, detect project type from marker files
# 2. Run pre-resolution commands (download sources, cache decompiled code)
# 3. Store resolved sources in {output.base_dir}/dependencies/
# 4. Investigation agents read from cache when verifying findings that reference external types

# Project type detection (first match wins)
detection:
  dotnet:
    markers: ["*.csproj", "*.sln", "*.fsproj"]

  java-maven:
    markers: ["pom.xml"]

  java-gradle:
    markers: ["build.gradle", "build.gradle.kts"]

  typescript:
    markers: ["tsconfig.json", "package.json"]

  python:
    markers: ["pyproject.toml", "setup.py", "requirements.txt"]

  go:
    markers: ["go.mod"]

# Resolution strategies per project type
strategies:
  dotnet:
    # Step 1: Restore packages (ensures DLLs are available)
    restore:
      command: "dotnet restore"
      cwd: "{project_root}"

    # Step 2: Locate compiled dependencies
    locate:
      # NuGet packages location
      paths:
        - "~/.nuget/packages"
        - "{project_root}/packages"
        - "{project_root}/**/bin/Debug/**/*.dll"
        - "{project_root}/**/bin/Release/**/*.dll"

    # Step 3: Decompile on-demand
    decompile:
      tool: "ilspycmd"
      check: "dotnet tool list -g | grep ilspycmd"
      install: "dotnet tool install -g ilspycmd"
      command: "ilspycmd --file {dll_path} --outputdir {output_dir} -r {reference_path}"

    # Symbol resolution patterns
    patterns:
      # Match: using Namespace.Type
      imports: "^using\\s+([A-Za-z0-9_.]+);"
      # Match: Type.Method() or Type property
      references: "([A-Z][A-Za-z0-9_]+)\\s*[.<(]"

  java-maven:
    restore:
      command: "mvn dependency:resolve -DincludeScope=compile -q"
      cwd: "{project_root}"

    # Try to download source JARs first (best quality)
    source_jars:
      command: "mvn dependency:sources -DincludeScope=compile -q"
      cwd: "{project_root}"
      cache: "~/.m2/repository/**/*-sources.jar"

    locate:
      paths:
        - "~/.m2/repository"
        - "{project_root}/target/dependency"

    # Fallback: decompile if no source JAR
    decompile:
      tool: "cfr"
      check: "which cfr || which cfr-decompiler"
      install: "brew install cfr"  # macOS; adjust for Linux
      command: "cfr {jar_path} --outputdir {output_dir} --silent true"

    patterns:
      imports: "^import\\s+([a-z0-9_.]+\\.[A-Z][A-Za-z0-9_]*);"
      references: "([A-Z][A-Za-z0-9_]+)\\s*[.<(]"

  java-gradle:
    restore:
      command: "./gradlew dependencies --configuration compileClasspath -q"
      cwd: "{project_root}"

    source_jars:
      # Gradle can be configured to download sources
      command: "./gradlew downloadSources -q || true"
      cwd: "{project_root}"
      cache: "~/.gradle/caches/modules-2/files-2.1/**/*-sources.jar"

    locate:
      paths:
        - "~/.gradle/caches/modules-2/files-2.1"
        - "{project_root}/build/libs"

    decompile:
      tool: "cfr"
      check: "which cfr || which cfr-decompiler"
      install: "brew install cfr"
      command: "cfr {jar_path} --outputdir {output_dir} --silent true"

    patterns:
      imports: "^import\\s+([a-z0-9_.]+\\.[A-Z][A-Za-z0-9_]*);"
      references: "([A-Z][A-Za-z0-9_]+)\\s*[.<(]"

  typescript:
    # TypeScript: Usually source is already in node_modules
    restore:
      command: "npm ci --ignore-scripts || npm install --ignore-scripts"
      cwd: "{project_root}"

    locate:
      paths:
        - "{project_root}/node_modules"

    # No decompilation needed - read directly
    # Priority: .ts > .d.ts > .js + .js.map
    source_priority:
      - "*.ts"
      - "*.tsx"
      - "*.d.ts"
      - "*.js"

    patterns:
      imports: "^import\\s+.*from\\s+['\"]([^'\"]+)['\"]"
      references: "([A-Z][A-Za-z0-9_]+)\\s*[.<(]"

  python:
    restore:
      command: "pip install -e . --quiet || pip install -r requirements.txt --quiet"
      cwd: "{project_root}"

    locate:
      paths:
        - "{project_root}/.venv/lib/python*/site-packages"
        - "~/.local/lib/python*/site-packages"
        - "/usr/local/lib/python*/site-packages"

    # Python: Usually source available (not compiled)
    # For .pyc, use uncompyle6 (but rare to need)
    decompile:
      tool: "uncompyle6"
      check: "pip show uncompyle6"
      install: "pip install uncompyle6"
      command: "uncompyle6 -o {output_dir} {pyc_path}"

    patterns:
      imports: "^(?:from|import)\\s+([a-zA-Z0-9_.]+)"
      references: "([A-Z][A-Za-z0-9_]+)\\s*[.(]"

  go:
    restore:
      command: "go mod download"
      cwd: "{project_root}"

    locate:
      # Go modules cache
      paths:
        - "$(go env GOMODCACHE)"
        - "~/go/pkg/mod"

    # Go: Source is always available in mod cache
    # No decompilation needed

    patterns:
      imports: "^import\\s+[\"']([^\"']+)[\"']"
      references: "([a-z][a-z0-9_]*)\\.([A-Z][A-Za-z0-9_]+)"

# Resolution workflow
workflow:
  # When to run resolution
  triggers:
    - on_extraction_complete: true   # After units extracted, before checking agents
    - on_investigation: true         # Before investigation agents (lazy resolution)

  # Cache settings
  cache:
    enabled: true
    dir: "{output.base_dir}/dependencies"
    ttl: "24h"  # Reuse cached sources for 24 hours

  # What to resolve
  resolution:
    # Resolve all imports upfront (thorough but slow)
    eager: false

    # Resolve only when investigation agents need it (fast, on-demand)
    lazy: true

    # Prioritize these namespaces (common internal/shared libraries)
    priority_patterns:
      - "*.Utilities"
      - "*.Common"
      - "*.Shared"
      - "*.Core"

# Investigation agent enrichment
investigation:
  # When verifying findings that reference external types:
  # 1. Parse the type name from the finding
  # 2. Find it in cached dependencies
  # 3. Add resolved source to investigation agent context

  # Max lines of resolved source to include per type
  max_context_lines: 100

  # Include these related items with resolved type
  include:
    - method_signatures
    - return_types
    - exceptions_thrown
    - doc_comments
