<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #0c0c0c;
      --bg-surface: #141414;
      --bg-elevated: #1a1a1a;
      --bg-hover: #222;
      --bg-code: #0a0a0a;
      --border: #2a2a2a;
      --border-active: #444;
      --text: #e8e8e8;
      --text-secondary: #888;
      --text-muted: #555;
      --confirmed: #ff6b6b;
      --confirmed-bg: rgba(255, 107, 107, 0.08);
      --false-pos: #51cf66;
      --false-pos-bg: rgba(81, 207, 102, 0.08);
      --needs-ctx: #fcc419;
      --needs-ctx-bg: rgba(252, 196, 25, 0.08);
      --diff-add: #51cf66;
      --diff-add-bg: rgba(81, 207, 102, 0.12);
      --diff-del: #ff6b6b;
      --diff-del-bg: rgba(255, 107, 107, 0.12);
      --accent: #748ffc;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 14px; }

    body {
      font-family: var(--sans);
      background: var(--bg-base);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-title {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .stat {
      text-align: center;
      padding: 0.75rem 0.5rem;
      background: var(--bg-elevated);
      border-radius: 6px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: var(--mono);
    }

    .stat-value.confirmed { color: var(--confirmed); }
    .stat-value.false-pos { color: var(--false-pos); }
    .stat-value.needs-ctx { color: var(--needs-ctx); }

    .stat-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.25rem;
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0;
    }

    .file-list::-webkit-scrollbar { width: 6px; }
    .file-list::-webkit-scrollbar-track { background: transparent; }
    .file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .file-item {
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      border-left: 2px solid transparent;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .file-item:hover {
      background: var(--bg-hover);
    }

    .file-item.active {
      background: var(--bg-elevated);
      border-left-color: var(--accent);
    }

    .file-icon {
      width: 16px;
      height: 16px;
      opacity: 0.5;
    }

    .file-name {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--text-secondary);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-item.active .file-name {
      color: var(--text);
    }

    .file-badge {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.5rem;
      border-radius: 10px;
      background: var(--confirmed-bg);
      color: var(--confirmed);
    }

    .file-badge.clean {
      background: var(--false-pos-bg);
      color: var(--false-pos);
    }

    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
    }

    .file-path {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--text);
    }

    .file-path-dir {
      color: var(--text-muted);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      font-family: var(--sans);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-active);
      color: var(--text);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn.primary:hover {
      filter: brightness(1.1);
    }

    .findings {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
    }

    .finding {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .finding-header {
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .finding-verdict {
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
    }

    .finding-verdict.confirmed {
      background: var(--confirmed-bg);
      color: var(--confirmed);
    }

    .finding-verdict.false-positive {
      background: var(--false-pos-bg);
      color: var(--false-pos);
    }

    .finding-verdict.needs-context {
      background: var(--needs-ctx-bg);
      color: var(--needs-ctx);
    }

    .finding-check {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
    }

    .finding-line {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    .finding-body {
      padding: 1.25rem;
    }

    .finding-issue {
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.6;
    }

    .finding-reason {
      font-size: 0.85rem;
      color: var(--text-secondary);
      padding-left: 1rem;
      border-left: 2px solid var(--border);
      margin-bottom: 1rem;
    }

    .code-diff {
      background: var(--bg-code);
      border-radius: 6px;
      overflow: hidden;
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .diff-header {
      padding: 0.75rem 1rem;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .diff-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .diff-explanation {
      font-family: var(--sans);
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-left: auto;
    }

    .diff-content {
      padding: 0;
    }

    .diff-line {
      display: flex;
      padding: 0 1rem;
      min-height: 1.7em;
    }

    .diff-line.del {
      background: var(--diff-del-bg);
    }

    .diff-line.add {
      background: var(--diff-add-bg);
    }

    .diff-gutter {
      width: 50px;
      flex-shrink: 0;
      color: var(--text-muted);
      text-align: right;
      padding-right: 1rem;
      user-select: none;
      border-right: 1px solid var(--border);
      margin-right: 1rem;
    }

    .diff-marker {
      width: 20px;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .diff-line.del .diff-marker { color: var(--diff-del); }
    .diff-line.add .diff-marker { color: var(--diff-add); }

    .diff-code {
      flex: 1;
      white-space: pre;
      overflow-x: auto;
    }

    .diff-line.del .diff-code { color: var(--diff-del); }
    .diff-line.add .diff-code { color: var(--diff-add); }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 3rem;
    }

    .empty-icon {
      width: 64px;
      height: 64px;
      margin-bottom: 1.5rem;
      opacity: 0.3;
    }

    .empty-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }

    .empty-desc {
      font-size: 0.9rem;
      max-width: 300px;
    }

    .finding-question {
      background: var(--needs-ctx-bg);
      border: 1px solid rgba(252, 196, 25, 0.2);
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
    }

    .question-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--needs-ctx);
      margin-bottom: 0.5rem;
    }

    .question-text {
      font-size: 0.85rem;
      color: var(--text);
    }

    .apply-fix {
      margin-top: 1rem;
      display: flex;
      justify-content: flex-end;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: relative;
        height: auto;
        max-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">Review Summary</div>
        <div class="stats">
          <div class="stat">
            <div class="stat-value confirmed" id="confirmed-count">0</div>
            <div class="stat-label">Issues</div>
          </div>
          <div class="stat">
            <div class="stat-value false-pos" id="false-pos-count">0</div>
            <div class="stat-label">OK</div>
          </div>
          <div class="stat">
            <div class="stat-value needs-ctx" id="needs-ctx-count">0</div>
            <div class="stat-label">Unknown</div>
          </div>
        </div>
      </div>
      <div class="file-list" id="file-list"></div>
    </aside>

    <main class="main">
      <div class="main-header" id="main-header" style="display: none;">
        <div class="file-path" id="file-path"></div>
        <div class="actions">
          <button class="btn" id="copy-btn">Copy Fixes</button>
          <button class="btn primary" id="apply-btn">Apply All</button>
        </div>
      </div>
      <div class="findings" id="findings">
        <div class="empty-state" id="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <div class="empty-title">Select a file</div>
          <div class="empty-desc">Choose a file from the sidebar to view its findings and suggested fixes.</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Data injected by main agent
    const DATA = window.REVIEW_DATA || { findings: [] };

    let currentFile = null;
    let groupedFindings = {};

    // Group findings by file
    function groupByFile(findings) {
      const grouped = {};
      for (const f of findings) {
        if (!grouped[f.file]) {
          grouped[f.file] = [];
        }
        grouped[f.file].push(f);
      }
      for (const file in grouped) {
        grouped[file].sort((a, b) => (a.line || 0) - (b.line || 0));
      }
      return grouped;
    }

    function getFileName(path) {
      return path.split('/').pop();
    }

    function getDirectory(path) {
      const parts = path.split('/');
      parts.pop();
      return parts.join('/');
    }

    function countByVerdict(findings, verdict) {
      return findings.filter(f => f.verdict === verdict).length;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Safe DOM creation
    function createElement(tag, attrs = {}, children = []) {
      const el = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === 'className') {
          el.className = value;
        } else if (key === 'textContent') {
          el.textContent = value;
        } else if (key.startsWith('data')) {
          el.setAttribute(key.replace(/([A-Z])/g, '-$1').toLowerCase(), value);
        } else {
          el.setAttribute(key, value);
        }
      }
      for (const child of children) {
        if (typeof child === 'string') {
          el.appendChild(document.createTextNode(child));
        } else if (child) {
          el.appendChild(child);
        }
      }
      return el;
    }

    // Create file item
    function createFileItem(file, findings) {
      const confirmedCount = countByVerdict(findings, 'CONFIRMED');
      const hasIssues = confirmedCount > 0;

      const item = createElement('div', {
        className: 'file-item',
        dataFile: file
      }, [
        createElement('svg', {
          className: 'file-icon',
          viewBox: '0 0 24 24',
          fill: 'none',
          stroke: 'currentColor',
          'stroke-width': '2'
        }),
        createElement('span', {
          className: 'file-name',
          textContent: getFileName(file),
          title: file
        }),
        createElement('span', {
          className: 'file-badge' + (hasIssues ? '' : ' clean'),
          textContent: hasIssues ? String(confirmedCount) : 'OK'
        })
      ]);

      // Add SVG paths
      const svg = item.querySelector('svg');
      const path1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path1.setAttribute('d', 'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z');
      const path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path2.setAttribute('d', 'M14 2v6h6M16 13H8M16 17H8M10 9H8');
      svg.appendChild(path1);
      svg.appendChild(path2);

      item.addEventListener('click', () => selectFile(file));
      return item;
    }

    // Create diff line
    function createDiffLine(type, lineNum, marker, code) {
      return createElement('div', {
        className: 'diff-line ' + type
      }, [
        createElement('span', { className: 'diff-gutter', textContent: String(lineNum) }),
        createElement('span', { className: 'diff-marker', textContent: marker }),
        createElement('span', { className: 'diff-code', textContent: code })
      ]);
    }

    // Create diff view
    function createDiff(fix) {
      if (!fix || !fix.old_string || !fix.new_string) return null;

      const oldLines = fix.old_string.split('\n');
      const newLines = fix.new_string.split('\n');

      const content = createElement('div', { className: 'diff-content' });
      oldLines.forEach((line, i) => {
        content.appendChild(createDiffLine('del', i + 1, '-', line));
      });
      newLines.forEach((line, i) => {
        content.appendChild(createDiffLine('add', i + 1, '+', line));
      });

      const header = createElement('div', { className: 'diff-header' }, [
        createElement('span', { className: 'diff-label', textContent: 'Suggested Fix' }),
        createElement('span', { className: 'diff-explanation', textContent: fix.explanation || '' })
      ]);

      return createElement('div', { className: 'code-diff' }, [header, content]);
    }

    // Create finding element
    function createFinding(f, index) {
      const verdictClass = f.verdict.toLowerCase().replace('_', '-');

      const header = createElement('div', { className: 'finding-header' }, [
        createElement('span', {
          className: 'finding-verdict ' + verdictClass,
          textContent: f.verdict.replace('_', ' ')
        }),
        createElement('span', { className: 'finding-check', textContent: f.check_id || '' }),
        createElement('span', { className: 'finding-line', textContent: 'Line ' + (f.line || '?') })
      ]);

      const body = createElement('div', { className: 'finding-body' });

      if (f.issue) {
        body.appendChild(createElement('div', { className: 'finding-issue', textContent: f.issue }));
      }

      if (f.reason) {
        body.appendChild(createElement('div', { className: 'finding-reason', textContent: f.reason }));
      }

      if (f.verdict === 'CONFIRMED' && f.fix) {
        const diff = createDiff(f.fix);
        if (diff) body.appendChild(diff);

        const applyBtn = createElement('button', { className: 'btn primary', textContent: 'Apply Fix' });
        applyBtn.addEventListener('click', () => applyFix(index));
        const applyWrap = createElement('div', { className: 'apply-fix' }, [applyBtn]);
        body.appendChild(applyWrap);
      }

      if (f.verdict === 'NEEDS_CONTEXT' && f.question) {
        body.appendChild(createElement('div', { className: 'finding-question' }, [
          createElement('div', { className: 'question-label', textContent: 'Unknown' }),
          createElement('div', { className: 'question-text', textContent: f.question })
        ]));
      }

      const finding = createElement('div', { className: 'finding' }, [header, body]);
      finding.style.animationDelay = (index * 0.05) + 's';
      return finding;
    }

    // Render file list
    function renderFileList() {
      const container = document.getElementById('file-list');
      container.replaceChildren();
      const files = Object.keys(groupedFindings).sort();
      files.forEach(file => {
        container.appendChild(createFileItem(file, groupedFindings[file]));
      });
    }

    // Render findings for a file
    function renderFindings(file, findings) {
      const container = document.getElementById('findings');
      const header = document.getElementById('main-header');
      const emptyState = document.getElementById('empty-state');
      const filePath = document.getElementById('file-path');

      header.style.display = 'flex';
      if (emptyState) emptyState.style.display = 'none';

      // Update file path
      const dir = getDirectory(file);
      const name = getFileName(file);
      filePath.replaceChildren();
      if (dir) {
        filePath.appendChild(createElement('span', { className: 'file-path-dir', textContent: dir + '/' }));
      }
      filePath.appendChild(document.createTextNode(name));

      // Clear and rebuild findings
      container.replaceChildren();
      findings.forEach((f, i) => {
        container.appendChild(createFinding(f, i));
      });
    }

    function selectFile(file) {
      currentFile = file;
      document.querySelectorAll('.file-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-file') === file);
      });
      renderFindings(file, groupedFindings[file] || []);
    }

    function applyFix(index) {
      const findings = groupedFindings[currentFile];
      if (!findings || !findings[index]) return;
      const fix = findings[index].fix;
      alert('Fix would be applied:\n\nFile: ' + currentFile + '\nOld: ' + fix.old_string + '\nNew: ' + fix.new_string);
    }

    function applyAllFixes() {
      const findings = groupedFindings[currentFile] || [];
      const fixes = findings.filter(f => f.verdict === 'CONFIRMED' && f.fix);
      alert('Would apply ' + fixes.length + ' fixes to ' + currentFile);
    }

    function copyFixes() {
      const findings = groupedFindings[currentFile] || [];
      const fixes = findings
        .filter(f => f.verdict === 'CONFIRMED' && f.fix)
        .map(f => '// Line ' + f.line + ': ' + f.check_id + '\n// ' + f.fix.explanation + '\n- ' + f.fix.old_string + '\n+ ' + f.fix.new_string)
        .join('\n\n');
      navigator.clipboard.writeText(fixes).then(() => {
        alert('Fixes copied to clipboard');
      });
    }

    // Initialize
    function init() {
      const findings = DATA.findings || [];

      document.getElementById('confirmed-count').textContent = countByVerdict(findings, 'CONFIRMED');
      document.getElementById('false-pos-count').textContent = countByVerdict(findings, 'FALSE_POSITIVE');
      document.getElementById('needs-ctx-count').textContent = countByVerdict(findings, 'NEEDS_CONTEXT');

      groupedFindings = groupByFile(findings);
      renderFileList();

      // Wire up buttons
      document.getElementById('copy-btn').addEventListener('click', copyFixes);
      document.getElementById('apply-btn').addEventListener('click', applyAllFixes);

      // Auto-select first file with issues
      const files = Object.keys(groupedFindings).sort();
      const firstWithIssues = files.find(f =>
        groupedFindings[f].some(finding => finding.verdict === 'CONFIRMED')
      );

      if (firstWithIssues) {
        selectFile(firstWithIssues);
      } else if (files.length > 0) {
        selectFile(files[0]);
      }
    }

    init();
  </script>
</body>
</html>
